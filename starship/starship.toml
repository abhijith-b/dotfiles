"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold dimmed white)$os$username$hostname$directory$git_branch$git_status$kubernetes$aws$azure$terraform$docker_context
[╰─](bold dimmed white)$character"""

[os]
disabled = false
style = "bold blue"

[username]
show_always = false
style_user = "bold yellow"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold green"
format = "[@$hostname]($style) "

[directory]
style = "bold cyan"
truncate_to_repo = true
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
ahead  = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

[kubernetes]
disabled = false
symbol = "⎈ "
style = "bold blue"
format = '[$symbol$context\($namespace\)]($style) '

[aws]
disabled = false
symbol = " "
style = "bold yellow"
format = '[$symbol($profile)(\[$duration\])]($style) '

[azure]
disabled = false
symbol = "󰠅 "
style = "bold blue"
format = '[$symbol($subscription)]($style) '

[terraform]
disabled = false
symbol = "󱁢 "
style = "bold purple"
format = '[$symbol$workspace]($style) '

[docker_context]
disabled = false
symbol = " "
style = "bold blue"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "
